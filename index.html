<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Mohammed Said" />
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="description"
      content="Full-Stack product engineer and consultant. I build complete products — the thinking and the code. Open for a technical partnership or a fixed-scope project."
    />
    <title>Mohammed Said — Product Engineer &amp; Consultant</title>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var t = q === 'dark' || q === 'light' ? q : localStorage.getItem('ms-theme')
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
